<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f2f6"/>
      <stop offset="0.55" stop-color="#eceef2"/>
      <stop offset="1" stop-color="#e4ecf6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6265"/>
      <stop offset="1" stop-color="#41586b"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
  </defs>

  <rect width="600" height="320" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="60" cy="50" r="120" fill="#9fd4e2" opacity="0.5"/>
    <circle cx="550" cy="280" r="130" fill="#b3ccec" opacity="0.5"/>
  </g>

  <text x="36" y="48" fill="#4d6265" font-size="13" letter-spacing="3" font-weight="700">MONOLITH → MICROSERVICES</text>
  <text x="36" y="70" fill="#5e7387" font-size="12">Legacy 3-module monolith split into 12 independent services.</text>

  <!-- Monolith box -->
  <rect x="36" y="100" width="150" height="80" rx="12" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="111" y="130" fill="#1a1c1c" font-size="14" font-weight="600" text-anchor="middle">Monolith</text>
  <text x="111" y="150" fill="#5e7387" font-size="11" text-anchor="middle">3 coupled modules</text>
  <text x="111" y="166" fill="#5e7387" font-size="11" text-anchor="middle">1 deployment</text>

  <!-- Arrow -->
  <line x1="190" y1="140" x2="230" y2="140" stroke="#6f8aa6" stroke-width="2" marker-end="url(#ah)"/>
  
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6f8aa6"/>
    </marker>
  </defs>

  <!-- Microservices cluster -->
  <rect x="242" y="90" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="279" y="113" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Auth</text>

  <rect x="326" y="90" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="363" y="113" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Users</text>

  <rect x="410" y="90" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="447" y="113" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Content</text>

  <rect x="242" y="140" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="279" y="163" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Payments</text>

  <rect x="326" y="140" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="363" y="163" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Notifications</text>

  <rect x="410" y="140" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="447" y="163" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">Analytics</text>

  <rect x="284" y="190" width="74" height="36" rx="8" fill="#ffffff" stroke="#cdd8e4"/>
  <text x="321" y="213" fill="#1a1c1c" font-size="11" font-weight="600" text-anchor="middle">+6 more</text>

  <!-- Terraform + AWS label -->
  <rect x="470" y="210" width="96" height="28" rx="14" fill="#41586b"/>
  <text x="518" y="229" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Terraform IaC</text>

  <!-- DR badge -->
  <rect x="36" y="210" width="190" height="28" rx="14" fill="#4d6265"/>
  <text x="131" y="229" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Cross-region DR on AWS</text>

  <line x1="36" y1="266" x2="564" y2="266" stroke="#ccd7e4" stroke-width="1"/>
  <text x="300" y="291" fill="#5e7387" font-size="11" text-anchor="middle">Nest.js  ·  Terraform  ·  AWS ECS / RDS / Lambda</text>
</svg>