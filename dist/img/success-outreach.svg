<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f2f6"/>
      <stop offset="0.55" stop-color="#eceef2"/>
      <stop offset="1" stop-color="#e4ecf6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d6265"/>
      <stop offset="1" stop-color="#41586b"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6f8aa6"/>
    </marker>
  </defs>

  <rect width="600" height="320" fill="url(#bg)"/>

  <g filter="url(#soft)">
    <circle cx="60" cy="50" r="120" fill="#9fd4e2" opacity="0.5"/>
    <circle cx="550" cy="280" r="130" fill="#b3ccec" opacity="0.5"/>
  </g>

  <text x="36" y="48" fill="#4d6265" font-size="13" letter-spacing="3" font-weight="700">MULTI-CHANNEL OUTREACH</text>
  <text x="36" y="70" fill="#5e7387" font-size="12">AI-powered cold outreach pipeline from lead to inbox.</text>

  <!-- Stage 1: Apify -->
  <rect x="36" y="100" width="150" height="80" rx="12" fill="#ffffff" stroke="#cdd8e4"/>
  <circle cx="62" cy="130" r="14" fill="url(#badge)"/>
  <text x="62" y="134" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="82" y="134" fill="#1a1c1c" font-size="13" font-weight="600">Apify Scraper</text>
  <text x="74" y="158" fill="#5e7387" font-size="11">LinkedIn lead</text>
  <text x="74" y="174" fill="#5e7387" font-size="11">extraction</text>

  <!-- Arrow -->
  <line x1="190" y1="140" x2="216" y2="140" stroke="#6f8aa6" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Stage 2: AI Copy -->
  <rect x="224" y="100" width="150" height="80" rx="12" fill="#ffffff" stroke="#cdd8e4"/>
  <circle cx="250" cy="130" r="14" fill="url(#badge)"/>
  <text x="250" y="134" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="270" y="134" fill="#1a1c1c" font-size="13" font-weight="600">AI Copy Gen</text>
  <text x="262" y="158" fill="#5e7387" font-size="11">Personalized</text>
  <text x="262" y="174" fill="#5e7387" font-size="11">email copy</text>

  <!-- Arrow -->
  <line x1="378" y1="140" x2="404" y2="140" stroke="#6f8aa6" stroke-width="2" marker-end="url(#ah)"/>

  <!-- Stage 3: Inbox -->
  <rect x="412" y="100" width="152" height="80" rx="12" fill="#ffffff" stroke="#cdd8e4"/>
  <circle cx="438" cy="130" r="14" fill="url(#badge)"/>
  <text x="438" y="134" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="458" y="134" fill="#1a1c1c" font-size="13" font-weight="600">Multi-account Inbox</text>
  <text x="450" y="158" fill="#5e7387" font-size="11">EmailEngine</text>
  <text x="450" y="174" fill="#5e7387" font-size="11">sequences</text>

  <!-- Self-hosted badge -->
  <rect x="36" y="210" width="160" height="28" rx="14" fill="#4d6265"/>
  <text x="116" y="229" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Self-hosted on openClaw</text>

  <line x1="36" y1="266" x2="564" y2="266" stroke="#ccd7e4" stroke-width="1"/>
  <text x="300" y="291" fill="#5e7387" font-size="11" text-anchor="middle">MERN  ·  OpenAI  ·  Apify  ·  EmailEngine  ·  openClaw</text>
</svg>